
name: Python CI

on:
  push:
    branches:
      - practice/ci-workflow
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile health_check.py
